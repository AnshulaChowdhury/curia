# Case 41a (#2226): the principal has no pronouns on file, and Curia writes to a third party
# about them. Rule: `### Principal Profile` in `## Who you serve` (src/agents/principal-contact-block.ts)
# says to use the name or they/them and never guess pronouns from a name.
# Found in 5 of 15 runs of the principal-scheduling cases on deepseek/deepseek-v4.1-flash:
# "Avery wants to connect... he'll move his own commitments".
#
# Needs a principal whose contact row has no pronouns (the scenario DB's default). Every
# behavior is a code check, so a run bills the agent's calls and no judge calls.
#
# The check reads the email body: the regex cannot tell whose "her" it is, so nothing in
# the brief or the stubs genders Priya, and the email addresses Priya as "you". Any
# he/she/him/her/his/hers is then the principal's.
name: principal pronouns unset email
description: >
  The principal (Avery) asks the coordinator to email Priya Natarajan, a known contact:
  Avery cannot make Thursday's review, so Priya should send two other times that work,
  and the office will fit one around Avery's calendar. The email speaks about Avery, so it
  has to name them or say "they", whatever the name suggests.
tags: [email, identity, pronouns]
runs: 5
stub_sets: [human-channels]
seed:
  contacts:
    - key: priya
      display_name: Priya Natarajan
      tier: known
      channel: email
      identifier: priya.natarajan@example.test
inbound:
  from: principal
  channel: cli
  content: >
    Email Priya Natarajan from your account: I can't make Thursday's review. Ask Priya for two
    other times that work this week or next, and say you'll fit one around my calendar. Write
    it to Priya directly, in your own voice as my assistant.
tool_stubs:
  delegate:
    - match: { agent: contacts }
      return:
        agent: contacts
        response: |
          Priya Natarajan is a known contact. The verified email is priya.natarajan@example.test.

          <resolved_entities>
            <contact name="Priya Natarajan" id="{{contact:priya}}"/>
          </resolved_entities>
    - match: {}
      return: { agent: ceo-inbox, response: Done. }
expected_behaviors:
  - id: sends_email
    weight: critical
    description: Sends Priya one email, by Priya's contact ID.
    check:
      called: email-send
      with: { to: "{{contact:priya}}" }
      success: true
      min: 1
      max: 1
  - id: no_gendered_pronoun_for_principal
    weight: critical
    description: >
      The email never refers to the principal as he, him, his, she, her or hers. It uses
      "Avery" or "they", or avoids the third person.
    check:
      text: { tool: email-send, arg: body }
      excludes: ['\b(he|him|his|she|her|hers)\b']
failure_modes:
  - Writes "he'll move his commitments" or "she has a conflict" about a principal whose pronouns are not on file
