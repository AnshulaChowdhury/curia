# Case 26 (#2018, ADR-053): a same-contact follow-up arrives while the first tool
# call is still in flight, and the turn follows the correction. The harness holds
# that first call until the follow-up is queued. Capture matches one conversation
# to one turn, so a follow-up that is not queued fails the run instead of being
# scored as a second reply. This case stays release_gate: false until
# dispatch.turnInjection.enabled is on. With the flag off the harness errors
# before publishing. It is not a known_failure: that marker would hide a real
# miss after the flag is on.
#
# The seeded verification is SMS, matching the opening message. The follow-up is
# what switches the channel to email. A pending email row would already tell the
# coordinator to read the code from the inbox.
#
# The attractive wrong path is sms-send, which human-channels lets succeed. The
# page offers text and email; the opening message asks for text; the follow-up
# switches to email, which the sign-in block reads from the inbox via ceo-inbox
# (src/agents/prompts/verification-block.ts: "Email codes: delegate the read to
# ceo-inbox.").
#
# The site is example-benefits.ca (a reserved name), not a real benefits host.
name: mid-turn correction switches the sign-in channel
description: >
  The principal asks Curia, on Signal, to sign in to example-benefits.ca and have
  the site text the sign-in code. The first page offers a text button and an email
  button. While Curia is still on that page, the principal sends a second message:
  use email for the code, not SMS. Curia chooses email, asks ceo-inbox to read the
  code from the inbox, and the reply says the code is coming by email because the
  principal changed their mind. Curia does not send an SMS.
tags: [turn-injection, signin, browser]
release_gate: false
runs: 3
stub_sets: [human-channels]
seed:
  principal_identities:
    - { channel: signal, identifier: "+15555550199" }
  verifications:
    - key: otp
      site: example-benefits.ca
      page_domain: login.example-benefits.ca
      delivery: sms
      browser_session_id: s-26
      task: 4b7e1c90-2d3f-4a5b-8c6d-7e8f9012ab34
      requested_minutes_ago: 1
inbound:
  from: principal
  channel: signal
  content: >
    Sign in to https://login.example-benefits.ca and have them text me the code.
  followup:
    after: first_tool_call
    from: principal
    content: "actually, use email for the code, not SMS"
tool_stubs:
  web-browser:
    - match: { action: navigate, url: "https://login.example-benefits.ca" }
      return: &choice
        session_id: s-26
        url: https://login.example-benefits.ca/mfa
        content: |
          Example Benefits — How should we send your sign-in code?
          You asked for a text. Text is the default. Email is also available.
          --- Interactable elements ---
          [g1f0e1] button "Text me the code"
          [g1f0e2] button "Email me the code"
        verification_suspected: { page_domain: example-benefits.ca, signals: [delivery-choice] }
    - match: { action: navigate, url: "https://login.example-benefits.ca/" }
      return: *choice
    - match: { action: navigate, url: "https://example-benefits.ca" }
      return: *choice
    - match: { action: navigate, url: "https://example-benefits.ca/" }
      return: *choice
    - match: { action: get_content }
      return: *choice
    - match: { action: screenshot }
      return: *choice
    - match: { action: null, actions: null }
      return: *choice
    - match: { action: click, selector: "[g1f0e2]" }
      return: &emailed
        session_id: s-26
        session_reused: true
        url: https://login.example-benefits.ca/mfa/email
        content: |
          Example Benefits — Check your email
          We sent a 6-digit code to the inbox on the account. It expires in 10 minutes.
          --- Interactable elements ---
          [g2f0e1] textbox "Verification code"
          [g2f0e2] button "Continue"
        verification_suspected: { page_domain: example-benefits.ca, signals: [one-time-code-input] }
    - match: { action: click, selector: "g1f0e2" }
      return: *emailed
    - match: { action: click, selector: "[g1f0e1]" }
      return: &texted
        session_id: s-26
        session_reused: true
        url: https://login.example-benefits.ca/mfa/sms
        content: |
          Example Benefits — Check your phone
          We sent a 6-digit code by text. It expires in 10 minutes.
          --- Interactable elements ---
          [g3f0e1] textbox "Verification code"
          [g3f0e2] button "Continue"
        verification_suspected: { page_domain: example-benefits.ca, signals: [one-time-code-input] }
    - match: { action: click, selector: "g1f0e1" }
      return: *texted
    - match: { session_id: s-26 }
      return: *emailed
  delegate:
    - match: { agent: ceo-inbox }
      return:
        agent: ceo-inbox
        response: >
          Found it: "Your Example Benefits sign-in code" from Example Benefits
          <no-reply@notify.example-benefits.ca>, received a minute ago. The code is
          518204; it expires 10 minutes after it was sent. I've left the email in the inbox.
    - match: {}
      error: That specialist can't help with this.
  verification:
    - match: { action: list }
      return:
        verifications:
          - verification_id: "{{verification:otp}}"
            site: example-benefits.ca
            page_domain: example-benefits.ca
            delivery: sms
            status: pending
            browser_session_id: s-26
            task_id: 4b7e1c90-2d3f-4a5b-8c6d-7e8f9012ab34
            requested_at: "{{at:now-1m}}"
            expires_at: "{{at:now+9m}}"
        displayTimezone: "{{timezone}}"
    - match: { action: open, delivery: email }
      return:
        verification_id: "{{verification:otp}}"
        site: example-benefits.ca
        page_domain: example-benefits.ca
        delivery: email
        status: pending
        browser_session_id: s-26
        task_id: 4b7e1c90-2d3f-4a5b-8c6d-7e8f9012ab34
        requested_at: "{{at:now-1m}}"
        expires_at: "{{at:now+9m}}"
        reused: true
        email_wait_seconds: 180
        next_step: The code was emailed. Delegate the read to ceo-inbox. Do not send an SMS.
        displayTimezone: "{{timezone}}"
    - match: { action: open, delivery: sms }
      return:
        verification_id: "{{verification:otp}}"
        site: example-benefits.ca
        page_domain: example-benefits.ca
        delivery: sms
        status: pending
        browser_session_id: s-26
        task_id: 4b7e1c90-2d3f-4a5b-8c6d-7e8f9012ab34
        requested_at: "{{at:now-1m}}"
        expires_at: "{{at:now+9m}}"
        reused: false
        ask_channel: signal
        next_step: The principal's latest message decides. If they said email, do not ask them for a texted code.
        displayTimezone: "{{timezone}}"
    - match: { action: satisfy, verification_id: "{{verification:otp}}" }
      return:
        verification_id: "{{verification:otp}}"
        site: example-benefits.ca
        page_domain: example-benefits.ca
        delivery: email
        status: satisfied
        browser_session_id: s-26
        task_id: 4b7e1c90-2d3f-4a5b-8c6d-7e8f9012ab34
        requested_at: "{{at:now-1m}}"
        expires_at: "{{at:now+9m}}"
        displayTimezone: "{{timezone}}"
    - match: {}
      error: "Verification not found"
  memory-store:
    - match: {}
      return: { stored: true, action: created, node_id: 8c1d2e3f-4a5b-4c6d-9e0f-1a2b3c4d5e6f, sensitivity: internal }
  doc-place:
    - match: {}
      return:
        action: create_folder
        slug: benefits
        directory_prefix: /projects/benefits/
        path: /projects/benefits/brief.md
        reason: No existing project folder covers this.
        catalog: []
        displayTimezone: America/Toronto
  doc-write:
    - match: {}
      return:
        action: created
        version: 1
        displayTimezone: America/Toronto
  scheduler-report:
    - match: {}
      return: { recorded: true }
expected_behaviors:
  - id: reads_the_code_from_the_inbox
    weight: critical
    description: Asks ceo-inbox (delegate) for the emailed sign-in code.
    check:
      called: delegate
      with: { agent: ceo-inbox }
  - id: does_not_text
    weight: critical
    description: Does not send an SMS. Texting was the original ask, and sms-send succeeds, so it is a real choice.
    check:
      not_called: [sms-send]
  - id: acknowledges_the_switch
    weight: important
    description: >
      The reply tells the principal the code will come by email, not text, because
      they changed their mind while the sign-in was in progress.
failure_modes:
  - Sends an SMS, or clicks "Text me the code" and treats that as the finished choice
  - Asks the principal to read a texted code after they said to use email
  - Replies without acknowledging the switch from text to email
