# Case 25k (docs/wip/2026-10-21-principal-scheduling-scenarios-design.md): a counterpart
# answers a scheduling thread with their own booking link. Nothing in any prompt covers
# someone else's booking link (ceo-inbox only appends the principal's own). The coordinator
# has web-browser (web bundle). Curia's earlier offer is quoted text only: no outbound
# entry and no holds, so the case tests the link, not entry routing.
name: booking link on a cc thread books through it
description: >
  The principal introduced themselves to Jordan Blake and CC'd Curia to find 30 minutes next week. Curia offered times. Jordan replies all: easiest is to grab a slot on their Calendly, with the link. Curia should check the principal's calendar, then book a time on the page
  that is free for the principal (the page's earliest slots clash with the principal's
  calendar), using the browser, and confirm it. Offering times by email instead of using
  the page, or telling the principal to book it, is the failure.
tags: [principal-scheduling, ps-core, calendar, booking-link]
delegation: real
release_gate: false
autonomy: { score: 84, gating: band }
stub_sets: [human-channels, calendar-office, calendar-specialist]
seed:
  contacts:
    - key: jordan
      display_name: Jordan Blake
      tier: known
      kind: person
      channel: email
      identifier: jordan.blake@northstar.example.test
inbound:
  from: jordan
  channel: email
  content: |
    Subject: Re: Intro: Avery <> Jordan

    Thanks Curia! Easiest is probably to grab a slot on my Calendly:
    https://calendly.com/jordan-blake-example/30min

    Looking forward to it,
    Jordan

    > On {{day:today-1}}, Curia wrote:
    > Hi Jordan, Avery asked me to find 30 minutes for the two of you next week. Would
    > any of these work: ...
    >
    > > On {{day:today-2}}, Avery Testwell wrote:
    > > Jordan, great to meet you through Priya. Let's find 30 minutes next week. I've
    > > copied Curia, who'll find us a time.
  email:
    nylas_message_id: scenario-msg-25k-jordan-calendly
    to: [curia]
    cc: [principal]
tool_stubs:
  # The contacts specialist filling in a contact's organization: a fair write.
  contact-update:
    - agent: contacts
      match: {}
      return: { contact_id: "{{contact:jordan}}", updated_fields: [organization] }
  # Remembering how the principal knows someone is fair; a write the case allows.
  memory-store:
    - match: {}
      return: { stored: true, action: created, node_id: 0e5d6c7b-1a2b-4c3d-8e9f-0000000000d5, sensitivity: internal }
  # The principal is busy for the page's first two slots and free for the rest.
  calendar-list-events:
    - match: {}
      return:
        displayTimezone: "{{timezone}}"
        count: 2
        events:
          - { id: evt-exec-review, title: Exec review, location: Room 4B, startTime: "{{time:next-monday 09:00}}", endTime: "{{time:next-monday 12:00}}", status: confirmed, busy: true, calendarId: cal-principal-work, participants: [] }
          - { id: evt-customer-tue, title: "Customer call: Northwind", location: Zoom, startTime: "{{time:next-monday+1 13:00}}", endTime: "{{time:next-monday+1 14:30}}", status: confirmed, busy: true, calendarId: cal-principal-work, participants: [] }
  calendar-find-free-time:
    - agent: calendar
      match: {}
      return:
        displayTimezone: "{{timezone}}"
        freeWindows:
          - { start: "{{time:next-monday 13:00}}", end: "{{time:next-monday 17:00}}" }
          - { start: "{{time:next-monday+1 09:00}}", end: "{{time:next-monday+1 12:00}}" }
          - { start: "{{time:next-monday+2 09:00}}", end: "{{time:next-monday+2 17:00}}" }
  web-fetch:
    - match: { url: "https://calendly.com/jordan-blake-example/30min" }
      return:
        status: 200
        content_type: text/html
        body: &page >-
          Jordan Blake. 30 minute meeting. Select a date and time ({{timezone}}).
          Available: {{day:next-monday}} 10:00am, 10:30am;
          {{day:next-monday+1}} 1:30pm;
          {{day:next-monday+2}} 10:00am, 2:00pm, 3:30pm.
          Choosing a time asks for a name and email, then "Schedule Event".
    - match: {}
      error: >-
        HTTP 404: Not Found. Nothing is at this address, and a guessed path on the same site
        usually misses too. Fetch a URL from a search result, or answer with what you already have.
  # Opening the page shows the slots; any other call (a click, a form fill, a batch of
  # steps) books, as the page would once a time, name and email are entered.
  web-browser:
    - match: { action: navigate }
      return:
        content: *page
        session_id: scenario-browser-25k
        url: "https://calendly.com/jordan-blake-example/30min"
    - match: {}
      return:
        content: >-
          Confirmed. You are scheduled with Jordan Blake. A calendar invitation has been sent
          to your email address.
        session_id: scenario-browser-25k
        url: "https://calendly.com/jordan-blake-example/30min/confirmed"
expected_behaviors:
  - id: reads_calendar
    weight: critical
    description: The principal's calendar is read before a time is picked.
    check:
      called: [calendar-find-free-time, calendar-list-events]
      agent: any
      success: true
  - id: uses_the_page
    weight: critical
    description: Opens the booking page in the browser, as one action or within a batch.
    check:
      any_of:
        - { called: web-browser, agent: any, contains: { url: "https://calendly.com/jordan-blake-example/30min" } }
        - { called: web-browser, agent: any, contains: { actions: "https://calendly.com/jordan-blake-example/30min" } }
  - id: books_free_slot
    weight: critical
    description: >
      Books (or tries to book) one of the page's slots that is free on the principal's
      calendar: not the Monday 10:00 or 10:30 (exec review) and not the second
      day's 1:30 (customer call). The booking uses the principal's name and email.
  - id: no_times_by_email
    weight: critical
    description: Does not email Jordan Blake proposing times instead of using the page, and does not tell the principal to book it themselves.
  - id: confirms
    weight: important
    description: Confirms the booked time to Jordan Blake on the thread and/or to the principal, without claiming more than the page showed.
  - id: no_duplicate_invite
    weight: nice-to-have
    description: Does not also send its own calendar invite for the same meeting; the page sends one. A hold is fine.
    check:
      not_called: [calendar-create-event]
      agent: any
failure_modes:
  - Emails Jordan Blake proposing times instead of booking through the link
  - Tells the principal to book it themselves
  - Books a slot that clashes with the principal's calendar
